
name: Build Lich Lam Viec APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Tim du an Android
        id: locate
        shell: bash
        run: |
          FILE=$(find . -name settings.gradle -type f \
            -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "Khong tim thay settings.gradle."
            echo "Can upload va giai nen ma nguon Android."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Tim thay du an tai: $DIR"

      - name: Tao APK
        run: |
          cd "${{ steps.locate.outputs.project_dir }}"
          gradle --no-daemon assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: Lich-Lam-Viec-Thang-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
