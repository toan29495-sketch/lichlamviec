
name: Build Lich Lam Viec APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Cai Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Giai nen ma nguon
        run: |
          unzip -o Lich_Lam_Viec_Thang_GitHub_Build.zip -d source

      - name: Tim du an
        id: locate
        run: |
          FILE=$(find source -name settings.gradle -type f | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Khong tim thay settings.gradle sau khi giai nen"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Tao APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          gradle --no-daemon assembleDebug

      - name: Xuat file APK
        uses: actions/upload-artifact@v4
        with:
          name: Lich-Lam-Viec-Thang-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
